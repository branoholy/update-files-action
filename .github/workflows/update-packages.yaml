name: 📦 Update packages

on:
  schedule:
    - cron: '0 17 * * 5' # Every Friday at 17:00 UTC
  workflow_dispatch:
    inputs:
      update-strategy:
        description: Update strategy
        type: choice
        default: Single PR
        options:
          - Single PR
          - Multiple PRs
      max-pull-requests:
        description: Max pull requests
        type: number
        default: 3

concurrency: update-packages

permissions:
  contents: write
  pull-requests: write

jobs:
  update-packages:
    name: Cluerise
    uses: cluerise/actions/.github/workflows/update-packages.yaml@v7.5.5
    with:
      app-id: ${{ vars.BRANOHOLY_PUBLIC_BOT_APP_ID }}
      update-strategy: ${{ inputs.update-strategy || 'Single PR' }}
      max-pull-requests: ${{ fromJSON(inputs.max-pull-requests || '3') }}
      package-groups: |
        {
          "vite": [
            "vite",
            "vitest"
          ]
        }
      ignored-packages: |
        [
          "typescript"
        ]
    secrets:
      app-private-key: ${{ secrets.BRANOHOLY_PUBLIC_BOT_APP_PRIVATE_KEY }}
