name: 🔩 Update package manager

on:
  schedule:
    - cron: '0 15 * * 2' # Every Tuesday at 15:00 UTC
  workflow_dispatch:

jobs:
  update-package-manager:
    name: Cluerise
    uses: cluerise/actions/.github/workflows/update-package-manager.yaml@v7.5.1
    with:
      app-id: ${{ vars.BRANOHOLY_BOT_APP_ID }}
    secrets:
      app-private-key: ${{ secrets.BRANOHOLY_BOT_APP_PRIVATE_KEY }}
