name: 📊 CI status

on:
  workflow_run:
    workflows: [⚙️ CI]
    types: [completed]
    branches: [main, latest]

jobs:
  send-status:
    name: Cluerise
    uses: cluerise/actions/.github/workflows/ci-status.yaml@v7.5.1
    with:
      app-id: ${{ vars.BRANOHOLY_PUBLIC_BOT_APP_ID }}
    secrets:
      app-private-key: ${{ secrets.BRANOHOLY_PUBLIC_BOT_APP_PRIVATE_KEY }}
