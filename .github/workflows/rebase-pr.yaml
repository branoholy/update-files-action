name: 🔄 Rebase PR

on:
  issue_comment:
    types: [created]

jobs:
  rebase-pr:
    name: Cluerise
    if: |
      github.event.issue.pull_request != null &&
      github.event.comment.body == '/rebase'

    uses: cluerise/actions/.github/workflows/rebase-pr.yaml@v7.5.1
    with:
      app-id: ${{ vars.BRANOHOLY_BOT_APP_ID }}
      squash: true
    secrets:
      app-private-key: ${{ secrets.BRANOHOLY_BOT_APP_PRIVATE_KEY }}
