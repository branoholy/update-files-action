name: 🟢 Update Node.js

on:
  schedule:
    - cron: '0 17 * * 1' # Every Monday at 17:00 UTC
  workflow_dispatch:

concurrency: update-node

permissions:
  contents: write
  pull-requests: write

jobs:
  update-node:
    name: Cluerise
    uses: cluerise/actions/.github/workflows/update-node.yaml@v7.5.3
    with:
      app-id: ${{ vars.BRANOHOLY_PUBLIC_BOT_APP_ID }}
    secrets:
      app-private-key: ${{ secrets.BRANOHOLY_PUBLIC_BOT_APP_PRIVATE_KEY }}
