name: 🤖 Automate PR

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: write

jobs:
  automate-pr:
    name: Automate PR
    runs-on: ubuntu-latest

    steps:
      - name: Get app token
        id: get-app-token
        uses: cluerise/actions/get-github-app-token@v7.5.5
        with:
          app-id: ${{ vars.BRANOHOLY_PUBLIC_BOT_APP_ID }}
          app-private-key: ${{ secrets.BRANOHOLY_PUBLIC_BOT_APP_PRIVATE_KEY }}

      - name: Assign author
        uses: cluerise/actions/assign-pr-author@v7.5.5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add labels
        uses: cluerise/actions/add-pr-labels@v7.5.5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Approve or request review
        uses: cluerise/actions/review-pr@v7.5.5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          trusted-user: branoholy
          trusted-bot: branoholy-public-bot[bot]
          reviewer: branoholy
          dependency-approved: >-
            ${{
              (
                github.head_ref == 'deps-update-lock-file' ||
                github.head_ref == 'deps-update-node' ||
                github.head_ref == 'deps-update-package-manager' ||

                github.head_ref == 'deps-dev-cluerise' ||
                github.head_ref == 'deps-dev-vite' ||

                github.head_ref == 'deps-dev-@cluerise/tools' ||
                startsWith(github.head_ref, 'deps-dev-@types/') ||
                github.head_ref == 'deps-dev-typescript' ||

                startsWith(github.head_ref, 'dependabot-github_actions-cluerise-actions-')
              )
            }}

      - name: Update title
        id: update-title
        uses: cluerise/actions/update-pr-title@v7.5.5
        with:
          token: ${{ steps.get-app-token.outputs.token }}

      - name: Auto-merge
        uses: cluerise/actions/auto-merge-pr@v7.5.5
        with:
          token: ${{ steps.get-app-token.outputs.token }}
          title: ${{ steps.update-title.outputs.title }}
          trusted-bot: branoholy-public-bot[bot]
