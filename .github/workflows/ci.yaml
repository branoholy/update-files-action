name: ⚙️ CI

on:
  push:
    branches-ignore:
      - '__*'

concurrency: ci-${{ github.sha }}

env:
  CI: true

permissions:
  contents: read

jobs:
  install:
    name: Install dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Install
        uses: cluerise/actions/install@v7.5.4

  build:
    name: Build project
    runs-on: ubuntu-latest
    needs: install
    steps:
      - name: Install
        uses: cluerise/actions/install@v7.5.4
      - name: Build project
        run: pnpm run build

  check-types:
    name: Check types
    runs-on: ubuntu-latest
    needs: install
    steps:
      - name: Install
        uses: cluerise/actions/install@v7.5.4
      - name: Check types
        run: pnpm run tc

  lint:
    name: Lint files
    runs-on: ubuntu-latest
    needs: install
    steps:
      - name: Install
        uses: cluerise/actions/install@v7.5.4
      - name: Lint files
        run: NODE_OPTIONS=--max-old-space-size=8192 pnpm run lint all

  test-unit:
    name: Test project (unit)
    runs-on: ubuntu-latest
    needs: install
    steps:
      - name: Install
        uses: cluerise/actions/install@v7.5.4
      - name: Test project
        run: pnpm run test:unit

  test-e2e:
    name: Test project (e2e)
    runs-on: ubuntu-latest
    needs: install
    steps:
      - name: Install
        uses: cluerise/actions/install@v7.5.4
      - name: Test project
        run: pnpm run test:e2e
