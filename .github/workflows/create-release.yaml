name: 🎉 Create release

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  create-release:
    name: Cluerise
    uses: cluerise/actions/.github/workflows/create-release.yaml@v7.5.1
    with:
      app-id: ${{ vars.BRANOHOLY_PUBLIC_BOT_APP_ID }}
    secrets:
      app-private-key: ${{ secrets.BRANOHOLY_PUBLIC_BOT_APP_PRIVATE_KEY }}
