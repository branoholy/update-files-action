name: 🔒 Update lock file

on:
  schedule:
    - cron: '0 17 * * 3' # Every Wednesday at 17:00 UTC
  workflow_dispatch:

concurrency: update-lock-file

permissions:
  contents: write
  pull-requests: write

jobs:
  update-lock-file:
    name: Cluerise
    uses: cluerise/actions/.github/workflows/update-lock-file.yaml@v7.5.2
    with:
      app-id: ${{ vars.BRANOHOLY_PUBLIC_BOT_APP_ID }}
    secrets:
      app-private-key: ${{ secrets.BRANOHOLY_PUBLIC_BOT_APP_PRIVATE_KEY }}
