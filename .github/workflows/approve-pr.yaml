name: ✅ Approve PR

on:
  issue_comment:
    types: [created]

jobs:
  approve-pr:
    name: Cluerise
    if: |
      github.event.issue.pull_request != null &&
      github.event.comment.body == '/approve' &&
      github.event.comment.user.login == 'branoholy'

    uses: cluerise/actions/.github/workflows/approve-pr.yaml@v7.5.1
    with:
      app-id: ${{ vars.BRANOHOLY_BOT_APP_ID }}
    secrets:
      app-private-key: ${{ secrets.BRANOHOLY_BOT_APP_PRIVATE_KEY }}
