version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: saturday
      time: '11:30'
    cooldown:
      exclude:
        - cluerise/actions
    pull-request-branch-name:
      separator: '-'
    open-pull-requests-limit: 10
    commit-message:
      prefix: deps(actions)
    labels:
      - 'type: deps'
      - 'scope: actions'
